# Semente do Altivy.Groundwork (componente dependency-updates): pertence ao projeto.
# Mensagens compatíveis com o título de PR e com o release-please:
# runtime = fix(deps) (gera release patch); desenvolvimento = build(deps-dev);
# actions = ci(actions); imagens e devcontainers = build(deps) (não geram release).
# Workflows gw-*.yml são atualizados somente no catálogo do Groundwork (groundwork update).
version: 2
updates:

  - package-ecosystem: github-actions
    directories:
      - "/"
    exclude-paths:
      - ".github/workflows/gw-*.yml"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Majors ficam fora das atualizações automáticas: exigem migração planejada e revisão de
  # licença (MediatR e AutoMapper passaram a ser comerciais) e o ignore também vale para as
  # atualizações de segurança. Vulnerabilidades que só se corrigem em major são tratadas à mão
  # a partir dos avisos do NuGetAudit no build.
  - package-ecosystem: nuget
    directories:
      - "/"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      prefix-development: "build"
      include: "scope"
    groups:
      nuget-production:
        dependency-type: production
        update-types: [minor, patch]
      nuget-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: devcontainers
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      devcontainers:
        patterns:
          - "*"
