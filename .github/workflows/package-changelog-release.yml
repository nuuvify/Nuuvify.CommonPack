# Local do Nuuvify.CommonPack (fora do catálogo do Altivy.Groundwork): fecha a seção
# "## [Não Lançado]" dos CHANGELOGs por pacote no Release PR do release-please, com commit do
# GitHub App de release. Idempotente: quando o release-please refaz a branch, o evento
# synchronize reaplica o fechamento. Ver docs/maintainers/release-process.md.
name: Package changelog release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions: {}

concurrency:
  group: package-changelog-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close:
    name: Close package changelogs
    if: >-
      github.event.pull_request.head.ref == 'release-please--branches--main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app.outputs.token }}

      - name: Close package changelogs
        id: close
        shell: pwsh
        run: |
          $changed = @(./tools/scripts/Update-PackageChangelogs.ps1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content -LiteralPath .release-please-manifest.json -Raw | ConvertFrom-Json -AsHashtable)['.']
          "version=$version" >> $env:GITHUB_OUTPUT
          "changed=$($changed.Count)" >> $env:GITHUB_OUTPUT
          if ($changed) {
            "### CHANGELOGs fechados em $version" >> $env:GITHUB_STEP_SUMMARY
            $changed | ForEach-Object { "- ``$_``" } >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "Nenhum CHANGELOG de pacote a fechar em $version." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Commit and push
        if: ${{ steps.close.outputs.changed != '0' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ steps.close.outputs.version }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -- 'src/*/CHANGELOG.md'
          git commit -m "docs: feche os CHANGELOGs dos pacotes na versão ${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"
