name: Publish and Release

on:
  push:
    branches:
      - main
      - qas
      - nugettest/qas
  workflow_dispatch:

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish packages and release
    runs-on: ${{ vars.GH_ACTIONS_UBUNTU_RUNNER != '' && vars.GH_ACTIONS_UBUNTU_RUNNER || 'ubuntu-24.04' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'qas' && 'preview' || 'nugettest' }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve release channel
        id: channel
        shell: pwsh
        run: |
          switch ('${{ github.ref_name }}') {
            'main' { $channel = 'stable' }
            'qas' { $channel = 'preview' }
            'nugettest/qas' { $channel = 'dev' }
            default { throw 'Branch de release nao suportada.' }
          }

          "value=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compute version
        id: version
        shell: pwsh
        run: ./.github/scripts/compute-version.ps1 -Channel '${{ steps.channel.outputs.value }}' -VersionFile 'src/Directory.Build.props' -RunNumber '${{ github.run_number }}'

      - name: Restore solution
        run: dotnet restore Nuuvify.CommonPack.sln

      - name: Build solution
        run: >
          dotnet build Nuuvify.CommonPack.sln --configuration Release --no-restore
          /p:VersionPrefix=${{ steps.version.outputs.version_prefix }}
          /p:VersionSuffix=${{ steps.version.outputs.version_suffix }}
          /p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          /p:FileVersionRevision=${{ steps.version.outputs.file_version_revision }}
          /p:ContinuousIntegrationBuild=true
          /p:RepositoryCommit=${{ github.sha }}

      - name: Run unit tests
        run: dotnet test Nuuvify.CommonPack.sln --configuration Release --no-build --filter "Category=Unit"

      - name: Run integration tests
        run: dotnet test Nuuvify.CommonPack.sln --configuration Release --no-build --filter "Category=Integration"

      - name: Pack solution
        run: >
          dotnet pack Nuuvify.CommonPack.sln --configuration Release --no-build -o ./artifacts
          /p:VersionPrefix=${{ steps.version.outputs.version_prefix }}
          /p:VersionSuffix=${{ steps.version.outputs.version_suffix }}
          /p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          /p:FileVersionRevision=${{ steps.version.outputs.file_version_revision }}
          /p:ContinuousIntegrationBuild=true
          /p:RepositoryCommit=${{ github.sha }}

      - name: Assert artifact versions
        shell: pwsh
        run: >
          ./.github/scripts/assert-artifact-version.ps1
          -ArtifactsPath './artifacts'
          -VersionFile 'src/Directory.Build.props'
          -ExpectedVersion '${{ steps.version.outputs.version }}'
          -ExpectedAssemblyVersion '${{ steps.version.outputs.assembly_version }}'
          -ExpectedFileVersion '${{ steps.version.outputs.file_version }}'

      - name: Build release notes
        if: ${{ steps.version.outputs.create_release == 'true' }}
        shell: pwsh
        run: ./.github/scripts/build-release-notes.ps1 -Version '${{ steps.version.outputs.version }}' -Channel '${{ steps.channel.outputs.value }}' -BaseBranch '${{ github.ref_name }}' -OutputPath './artifacts/release-notes.md'

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Create git tag
        if: ${{ steps.version.outputs.create_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} ja existe."
          else
            git tag "${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi

      - name: Publish to NuGet.org
        if: ${{ steps.channel.outputs.value != 'dev' }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'O secret NUGET_API_KEY nao foi configurado no environment atual.'
          }

          $packages = @(Get-ChildItem -Path ./artifacts -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw 'Nenhum pacote NuGet foi gerado.'
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source '${{ steps.version.outputs.nuget_source }}' --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao publicar $($package.Name)."
            }
          }

      - name: Publish to nugettest
        if: ${{ steps.channel.outputs.value == 'dev' }}
        shell: pwsh
        env:
          NUGETTEST_API_KEY: ${{ secrets.NUGETTEST_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGETTEST_API_KEY)) {
            throw 'O secret NUGETTEST_API_KEY nao foi configurado no environment atual.'
          }

          $packages = @(Get-ChildItem -Path ./artifacts -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw 'Nenhum pacote NuGet foi gerado.'
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGETTEST_API_KEY --source '${{ steps.version.outputs.nuget_source }}' --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao publicar $($package.Name)."
            }
          }

      - name: Create GitHub release
        if: ${{ steps.version.outputs.create_release == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} ja existe."
          else
            prerelease_flag=""
            if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
              prerelease_flag="--prerelease"
            fi

            gh release create "${{ steps.version.outputs.tag }}" \
              artifacts/*.nupkg \
              artifacts/*.snupkg \
              --target "${{ github.sha }}" \
              --title "${{ steps.version.outputs.tag }}" \
              --notes-file ./artifacts/release-notes.md \
              $prerelease_flag
          fi
