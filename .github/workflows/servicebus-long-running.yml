# Local do Nuuvify.CommonPack (fora do catálogo do Altivy.Groundwork): executa os testes da
# categoria ServiceBusLongRunning, que dependem de tentativas de conexão do Azure SDK e podem levar
# mais de 15 minutos. Chamado pelo ci.yml (incluído no Result), só roda os testes quando o CHANGELOG
# do pacote Nuuvify.CommonPack.AzureServiceBus ou o projeto de testes dele mudam; nos demais casos
# termina com sucesso sem executar. Ver docs/contributing/testing.md.
name: Service Bus long-running tests

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Service Bus long-running tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Service Bus changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            pull_request) range="origin/$BASE_REF...HEAD" ;;
            push)
              if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then range="HEAD~1..HEAD"; else range="$BEFORE..HEAD"; fi ;;
            *) range="HEAD~1..HEAD" ;;
          esac
          if git diff --name-only "$range" -- \
              src/Nuuvify.CommonPack.AzureServiceBus/CHANGELOG.md \
              test/Nuuvify.CommonPack.AzureServiceBus.xTest | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Sem mudança no CHANGELOG do AzureServiceBus nem nos testes dele; testes longos não executados." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup .NET SDK
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: >-
          dotnet test test/Nuuvify.CommonPack.AzureServiceBus.xTest --configuration Release
          --filter "Category=ServiceBusLongRunning"
