name: Recover preview GitHub Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID da execução CI que publicou o preview no NuGet.org
        required: true
        type: string

permissions: {}

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Recover published packages
        id: packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::ID de execução inválido."; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          jq -e '.path == ".github/workflows/ci.yml" and .event == "push" and .head_branch == "main" and .conclusion == "success"' <<<"$run" >/dev/null
          commit="$(jq -er .head_sha <<<"$run")"
          number="$(jq -er .run_number <<<"$run")"
          job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" |
            jq -er '[.jobs[] | select(.name == "Snapshot" and .conclusion == "success") | .id] | if length == 1 then .[0] else error("Snapshot bem-sucedido não encontrado") end')"
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" |
            bash ./tools/scripts/Get-PreviewPackageList.sh > "$RUNNER_TEMP/preview-packages"
          [[ -s "$RUNNER_TEMP/preview-packages" ]] || { echo "::error::Nenhum pacote encontrado no log."; exit 1; }
          versions="$(awk '{print $2}' "$RUNNER_TEMP/preview-packages" | sort -u)"
          [[ "$versions" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ && "$versions" == *"-preview.$number" ]] || { echo "::error::Versão inconsistente com a execução."; exit 1; }
          [[ "$(wc -l < "$RUNNER_TEMP/preview-packages")" == "$(sort -u "$RUNNER_TEMP/preview-packages" | wc -l)" ]] || { echo "::error::Pacotes duplicados no log."; exit 1; }
          mkdir -p artifacts/nupkg
          while read -r id version; do
            lower_id="${id,,}"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 5 --retry-delay 10 \
              "https://api.nuget.org/v3-flatcontainer/$lower_id/$version/$lower_id.$version.nupkg" \
              --output "artifacts/nupkg/$id.$version.nupkg"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 5 --retry-delay 10 \
              "https://www.nuget.org/api/v2/symbolpackage/$id/$version" \
              --output "artifacts/nupkg/$id.$version.snupkg"
          done < "$RUNNER_TEMP/preview-packages"
          echo "tag=v$versions" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Create release GitHub App token
        id: release-app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish preview GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ steps.packages.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.packages.outputs.commit }}
        run: |
          set -euo pipefail
          bash ./tools/scripts/Publish-GitHubRelease.sh prepare-preview
          bash ./tools/scripts/Publish-GitHubRelease.sh preview
