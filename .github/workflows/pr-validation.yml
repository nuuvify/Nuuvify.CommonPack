name: PR Validation

on:
  pull_request:
    branches:
      - main
      - qas
      - nugettest/qas

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-policy:
    name: Version policy check
    runs-on: ${{ vars.GH_ACTIONS_UBUNTU_RUNNER != '' && vars.GH_ACTIONS_UBUNTU_RUNNER || 'ubuntu-24.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VersionPrefix and monotonicity
        shell: pwsh
        run: |
          $propsFile = 'src/Directory.Build.props'
          $content = Get-Content -Path $propsFile -Raw

          # Proibe propriedades derivadas no props
          foreach ($derived in @('AssemblyVersion', 'FileVersion', 'InformationalVersion', '<Version>')) {
            if ($content -match "<$derived>[^<]+</$derived>" -and $derived -ne 'AssemblyVersion') {
              Write-Warning "Propriedade derivada '$derived' nao deve ser editada manualmente em $propsFile"
            }
          }

          $match = [regex]::Match($content, '<VersionPrefix>(?<v>\d+\.\d+\.\d+)</VersionPrefix>')
          if (-not $match.Success) {
            Write-Error "VersionPrefix ausente ou em formato invalido em $propsFile."
            exit 1
          }
          $versionPrefix = $match.Groups['v'].Value

          # Valida monotonicidade apenas em PRs para main
          if ('${{ github.event.pull_request.base.ref }}' -ne 'main') {
            Write-Host "VersionPrefix=$versionPrefix (canal nao-main; monotonicidade nao validada)."
            exit 0
          }

          $baseSha = (git merge-base HEAD "origin/${{ github.event.pull_request.base.ref }}" 2>$null | Out-String).Trim()
          $baseContent = (git show "${baseSha}:src/Directory.Build.props" 2>$null | Out-String)
          $baseMatch = [regex]::Match($baseContent, '<VersionPrefix>(?<v>\d+\.\d+\.\d+)</VersionPrefix>')
          $baseVersion = if ($baseMatch.Success) { $baseMatch.Groups['v'].Value } else { '0.0.0' }

          if ($versionPrefix -eq $baseVersion) {
            Write-Host "VersionPrefix nao mudou no diff ($versionPrefix vs base $baseVersion)."
          } else {
            Write-Host "VersionPrefix mudou no diff: $baseVersion -> $versionPrefix."
          }

          # Independente do diff, o VersionPrefix em PRs para main deve ser > última tag estável
          $ErrorActionPreference = 'Continue'
          $tags = (git tag --list 'v[0-9]*.[0-9]*.[0-9]*' 2>$null) -split "`n" |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }
          $ErrorActionPreference = 'Stop'

          if ($tags) {
            $latest = $tags |
                ForEach-Object { [System.Version]($_ -replace '^v', '') } |
                Sort-Object -Descending |
                Select-Object -First 1

            $proposed = [System.Version]$versionPrefix
            if ($proposed -le $latest) {
              Write-Error ("VersionPrefix $versionPrefix nao e maior que a ultima tag estavel v$latest. " +
                "Execute prepare-release.yml com uma versao superior antes de mergear em main.")
              exit 1
            }
          }

          Write-Host "VersionPrefix=$versionPrefix e monotonicamente maior que todas as tags. OK."

  changelog-check:
    name: Verify package CHANGELOG updated
    runs-on: ${{ vars.GH_ACTIONS_UBUNTU_RUNNER != '' && vars.GH_ACTIONS_UBUNTU_RUNNER || 'ubuntu-24.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG updated for modified packages
        shell: pwsh
        run: |
          $baseBranch = '${{ github.event.pull_request.base.ref }}'
          $changedFiles = (git diff --name-only "origin/$baseBranch...HEAD") -split "`n" | Where-Object { $_ -ne '' }

          $modifiedPackages = $changedFiles |
            Where-Object { $_ -match '^src/([^/]+)/.*\.(cs|csproj)$' } |
            ForEach-Object { ($_ -split '/')[1] } |
            Select-Object -Unique

          $failures = @()
          foreach ($pkg in $modifiedPackages) {
            $changelogPath = "src/$pkg/CHANGELOG.md"
            if ($changedFiles -notcontains $changelogPath) {
              $failures += $pkg
            }
          }

          if ($failures.Count -gt 0) {
            $msg = "Os seguintes pacotes tiveram código alterado mas o CHANGELOG.md não foi atualizado:`n"
            $msg += ($failures | ForEach-Object { "  - src/$_/CHANGELOG.md" }) -join "`n"
            Write-Error $msg
            exit 1
          }

          if ($modifiedPackages.Count -gt 0 -and $changedFiles -notcontains 'CHANGELOG.md') {
            Write-Error 'O CHANGELOG.md raiz deve ser atualizado quando houver alteração de código em pacotes.'
            exit 1
          }

          Write-Host "Os changelogs obrigatórios foram atualizados."

  build-and-unit-tests:
    name: Build and unit tests
    runs-on: ${{ vars.GH_ACTIONS_UBUNTU_RUNNER != '' && vars.GH_ACTIONS_UBUNTU_RUNNER || 'ubuntu-24.04' }}
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate SonarCloud token
        if: ${{ env.SONAR_ENABLED == 'true' }}
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'O secret SONAR_TOKEN não foi configurado.'
          }

      - name: Restore .NET tools
        if: ${{ env.SONAR_ENABLED == 'true' }}
        run: dotnet tool restore

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore Nuuvify.CommonPack.sln

      - name: Begin SonarCloud analysis
        if: ${{ env.SONAR_ENABLED == 'true' }}
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: nuuvify_Nuuvify.CommonPack
          SONAR_ORGANIZATION: nuuvify
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PULL_REQUEST_KEY: ${{ github.event.pull_request.number }}
        run: |
          $arguments = @(
            'begin',
            "/k:$env:SONAR_PROJECT_KEY",
            "/o:$env:SONAR_ORGANIZATION",
            "/d:sonar.host.url=$env:SONAR_HOST_URL",
            "/d:sonar.token=$env:SONAR_TOKEN",
            '/d:sonar.qualitygate.wait=true',
            '/d:sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml',
                    '/d:sonar.coverage.exclusions=**/*Tests.cs,**/*Test.cs,**/Migrations/**,**/Examples/**',
            "/d:sonar.pullrequest.key=$env:SONAR_PULL_REQUEST_KEY",
            "/d:sonar.pullrequest.branch=$env:GITHUB_HEAD_REF",
            "/d:sonar.pullrequest.base=$env:GITHUB_BASE_REF"
          )

          dotnet sonarscanner @arguments

      - name: Build solution
        run: dotnet build Nuuvify.CommonPack.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test Nuuvify.CommonPack.sln --configuration Release --no-build --filter "Category=Unit" --collect:"XPlat Code Coverage" --results-directory ./artifacts/sonar-test-results -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        if: ${{ env.SONAR_ENABLED == 'true' }}
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end "/d:sonar.token=$env:SONAR_TOKEN"

      - name: Pack solution
        run: dotnet pack Nuuvify.CommonPack.sln --configuration Release --no-build -o ./artifacts

      - name: Assert artifact versions
        shell: pwsh
        run: ./.github/scripts/assert-artifact-version.ps1 -ArtifactsPath './artifacts' -VersionFile 'src/Directory.Build.props'

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: ${{ vars.GH_ACTIONS_UBUNTU_RUNNER != '' && vars.GH_ACTIONS_UBUNTU_RUNNER || 'ubuntu-24.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore Nuuvify.CommonPack.sln

      - name: Build solution
        run: dotnet build Nuuvify.CommonPack.sln --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test Nuuvify.CommonPack.sln --configuration Release --no-build --filter "Category=Integration"
