# Semente do Altivy.Groundwork (componente ci): pertence ao projeto.
# Adicione aqui os jobs do projeto e inclua cada um em "needs" do job Result,
# que é o ÚNICO check obrigatório da branch padrão (ver .github/CI-CD.md).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Tag estável em rascunho para gerar um preview (opcional)
        required: false
        type: string

permissions: {}

# Em PRs, uma execução nova espera a anterior: cancelar uma execução em andamento deixa um check
# Result com falha no mesmo commit, e o ruleset considera todas as execuções do check, bloqueando o merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  hygiene:
    name: Hygiene
    uses: ./.github/workflows/gw-pr-hygiene.yml
    permissions:
      contents: read

  gitleaks:
    name: Gitleaks
    uses: ./.github/workflows/gw-gitleaks.yml
    permissions:
      contents: read

  dotnet:
    name: .NET
    uses: ./.github/workflows/gw-dotnet.yml
    permissions:
      contents: read
    with:
      solution: Nuuvify.CommonPack.sln
      test-filter: Category=Unit&Category!=ServiceBusLongRunning
      pack: true

  # Local: os testes de integração usam Testcontainers (SQL Server) e precisam do Docker do runner,
  # indisponível dentro do container do gw-dotnet.yml.
  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test preview publication
        run: |
          bash ./tools/scripts/tests/Get-SnapshotVersion.Tests.sh
          bash ./tools/scripts/tests/Prepare-DraftPreview.Tests.sh
          bash ./tools/scripts/tests/Publish-PreviewNuGet.Tests.sh
          bash ./tools/scripts/tests/Publish-GitHubRelease.Tests.sh

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Nuuvify.CommonPack.sln

      - name: Build
        run: dotnet build Nuuvify.CommonPack.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Nuuvify.CommonPack.sln --configuration Release --no-build --filter "Category=Integration"

  # Local: análise de PR no SonarCloud. Sem SONAR_TOKEN (Dependabot, forks) ou fora de PR, o job
  # termina com sucesso sem analisar; a branch padrão é analisada pelo sonarcloud.yml.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      SONAR_ENABLED: ${{ github.event_name == 'pull_request' && secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Report skipped analysis
        if: ${{ env.SONAR_ENABLED != 'true' }}
        run: echo "Análise do SonarCloud não executada (evento $GITHUB_EVENT_NAME ou SONAR_TOKEN indisponível)."

      - name: Checkout
        if: ${{ env.SONAR_ENABLED == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        if: ${{ env.SONAR_ENABLED == 'true' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        if: ${{ env.SONAR_ENABLED == 'true' }}
        run: |
          dotnet tool restore
          dotnet restore Nuuvify.CommonPack.sln

      - name: Begin SonarCloud analysis
        if: ${{ env.SONAR_ENABLED == 'true' }}
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST_KEY: ${{ github.event.pull_request.number }}
        run: |
          $arguments = @(
            'begin',
            '/k:nuuvify_Nuuvify.CommonPack',
            '/o:nuuvify',
            '/d:sonar.host.url=https://sonarcloud.io',
            "/d:sonar.token=$env:SONAR_TOKEN",
            '/d:sonar.qualitygate.wait=true',
            '/d:sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml',
            '/d:sonar.coverage.exclusions=**/*Tests.cs,**/*Test.cs,**/Migrations/**,**/Examples/**',
            '/d:sonar.exclusions=**/Examples/**,**/.github/**,**/.groundwork/**,**/*.ps1',
            "/d:sonar.pullrequest.key=$env:SONAR_PULL_REQUEST_KEY",
            "/d:sonar.pullrequest.branch=$env:GITHUB_HEAD_REF",
            "/d:sonar.pullrequest.base=$env:GITHUB_BASE_REF"
          )
          dotnet sonarscanner @arguments

      - name: Build
        if: ${{ env.SONAR_ENABLED == 'true' }}
        run: dotnet build Nuuvify.CommonPack.sln --configuration Release --no-restore

      - name: Unit tests with coverage
        if: ${{ env.SONAR_ENABLED == 'true' }}
        run: >-
          dotnet test Nuuvify.CommonPack.sln --configuration Release --no-build --filter "Category=Unit&Category!=ServiceBusLongRunning"
          --collect:"XPlat Code Coverage" --results-directory ./artifacts/sonar-test-results
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        if: ${{ env.SONAR_ENABLED == 'true' }}
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end "/d:sonar.token=$env:SONAR_TOKEN"

  # Local: testes ServiceBusLongRunning, executados só quando o pacote AzureServiceBus muda.
  servicebus-long-running:
    name: Service Bus
    uses: ./.github/workflows/servicebus-long-running.yml
    permissions:
      contents: read

  package-changelog:
    name: Package changelog
    uses: ./.github/workflows/package-changelog.yml
    permissions:
      contents: read

  snapshot-version:
    name: Snapshot version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish_snapshot || steps.skip.outputs.publish_snapshot }}
      version: ${{ steps.version.outputs.version }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      file_version: ${{ steps.version.outputs.file_version }}
    steps:
      - name: Skip non-automatic snapshots
        id: skip
        if: ${{ github.event_name != 'push' }}
        run: echo "publish_snapshot=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute snapshot version
        id: version
        if: ${{ github.event_name == 'push' }}
        run: >
          pwsh ./tools/scripts/ci/Get-SnapshotVersion.ps1
          -RunNumber "$GITHUB_RUN_NUMBER" -OutputPath "$GITHUB_OUTPUT"

  snapshot:
    name: Snapshot
    needs: [hygiene, gitleaks, dotnet, integration, sonar, servicebus-long-running, package-changelog, snapshot-version]
    if: ${{ success() && ((github.event_name == 'push' && needs.snapshot-version.outputs.publish == 'true') || (github.event_name == 'workflow_dispatch' && inputs.draft_tag != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Validate NuGet account
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::Configure a variável NUGET_USER com o nome de usuário do NuGet.org."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release GitHub App token
        id: release-app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Validate draft preview
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          PREVIEW_DRAFT_TAG: ${{ inputs.draft_tag }}
        run: bash ./tools/scripts/Prepare-DraftPreview.sh resolve

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Compute version
        id: version
        shell: bash
        env:
          PREVIEW_DRAFT_TAG: ${{ inputs.draft_tag }}
          SNAPSHOT_VERSION_OUTPUTS: ${{ toJSON(needs.snapshot-version.outputs) }}
        run: |
          if [[ -n "$PREVIEW_DRAFT_TAG" ]]; then
            bash "$GITHUB_WORKSPACE/tools/scripts/Prepare-DraftPreview.sh" version
          else
            for key in version version_prefix version_suffix assembly_version file_version; do
              value="$(jq -r --arg key "$key" '.[$key] // ""' <<<"$SNAPSHOT_VERSION_OUTPUTS")"
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
            done
          fi
      - name: Build
        env:
          VERSION_PREFIX: ${{ steps.version.outputs.version_prefix }}
          VERSION_SUFFIX: ${{ steps.version.outputs.version_suffix }}
          ASSEMBLY_VERSION: ${{ steps.version.outputs.assembly_version }}
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
        run: >
          dotnet build Nuuvify.CommonPack.sln --configuration Release
          "-p:VersionPrefix=$VERSION_PREFIX" "-p:VersionSuffix=$VERSION_SUFFIX"
          "-p:AssemblyVersion=$ASSEMBLY_VERSION" "-p:FileVersion=$FILE_VERSION"
          -p:ContinuousIntegrationBuild=true "-p:RepositoryCommit=$GITHUB_SHA"

      - name: Pack
        env:
          VERSION_PREFIX: ${{ steps.version.outputs.version_prefix }}
          VERSION_SUFFIX: ${{ steps.version.outputs.version_suffix }}
          ASSEMBLY_VERSION: ${{ steps.version.outputs.assembly_version }}
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
        run: >
          dotnet pack Nuuvify.CommonPack.sln --configuration Release --no-build --output ./artifacts/nupkg
          "-p:VersionPrefix=$VERSION_PREFIX" "-p:VersionSuffix=$VERSION_SUFFIX"
          "-p:AssemblyVersion=$ASSEMBLY_VERSION" "-p:FileVersion=$FILE_VERSION"
          -p:ContinuousIntegrationBuild=true "-p:RepositoryCommit=$GITHUB_SHA"

      - name: Assert artifact versions
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_ASSEMBLY_VERSION: ${{ steps.version.outputs.assembly_version }}
          EXPECTED_FILE_VERSION: ${{ steps.version.outputs.file_version }}
        run: >
          ./tools/scripts/ci/Assert-ArtifactVersion.ps1 -ArtifactsPath ./artifacts/nupkg
          -ExpectedVersion $env:EXPECTED_VERSION -ExpectedAssemblyVersion $env:EXPECTED_ASSEMBLY_VERSION
          -ExpectedFileVersion $env:EXPECTED_FILE_VERSION

      - name: Create preview GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash ./tools/scripts/Publish-GitHubRelease.sh prepare-preview

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish preview packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: bash ./tools/scripts/Publish-PreviewNuGet.sh

      - name: Attach packages to preview GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash ./tools/scripts/Publish-GitHubRelease.sh preview

  result:
    name: Result
    if: ${{ always() }}
    needs: [hygiene, gitleaks, dotnet, integration, sonar, servicebus-long-running, package-changelog, snapshot-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "::error::Jobs obrigatórios sem sucesso: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "Todos os jobs obrigatórios terminaram com sucesso."
